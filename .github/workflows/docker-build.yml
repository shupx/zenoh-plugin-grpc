name: Build Docker image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-image
  cancel-in-progress: false

env:
  IMAGE_NAME: shupeixuan/zenoh-plugin-grpc-build

jobs:
  metadata:
    name: Resolve image version
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.version.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Zenoh and Rust versions
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              workspace = tomllib.load(manifest)
          with open("rust-toolchain.toml", "rb") as manifest:
              toolchain = tomllib.load(manifest)
          zenoh_version = workspace["workspace"]["dependencies"]["zenoh"]["version"]
          if not zenoh_version.startswith("="):
              raise SystemExit("Zenoh dependency must be pinned to an exact version")
          rust_version = toolchain["toolchain"]["channel"]
          tag = f"zenoh-{zenoh_version[1:]}-rust-{rust_version}"
          if not re.fullmatch(r"[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}", tag):
              raise SystemExit(f"Invalid Docker image tag: {tag}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"image_tag={tag}", file=output)
          print(f"Image tag: {tag}")
          PY

  build:
    name: Build ${{ matrix.arch }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=build-image-${{ matrix.arch }}
          cache-to: type=gha,scope=build-image-${{ matrix.arch }},mode=max

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: docker-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-architecture image
    needs:
      - metadata
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: docker-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and verify multi-architecture manifest
        env:
          IMAGE_TAG: ${{ needs.metadata.outputs.image_tag }}
        shell: bash
        run: |
          shopt -s nullglob
          digest_files=("$RUNNER_TEMP"/digests/*)
          [[ ${#digest_files[@]} -eq 2 ]]
          sources=()
          for digest_file in "${digest_files[@]}"; do
            digest="${digest_file##*/}"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            sources+=("$IMAGE_NAME@sha256:$digest")
          done
          image="$IMAGE_NAME:$IMAGE_TAG"
          docker buildx imagetools create --tag "$image" "${sources[@]}"
          docker buildx imagetools inspect "$image"
          docker buildx imagetools inspect --raw "$image" | jq -e '
            [.manifests[].platform | "\(.os)/\(.architecture)"] | sort
            == ["linux/amd64", "linux/arm64"]
          '
          printf 'Published `%s` with `linux/amd64` and `linux/arm64`.\n' \
            "$image" >> "$GITHUB_STEP_SUMMARY"
